# Compose de produção para o Dokploy (serviço do tipo Docker Compose).
# Variáveis esperadas no painel do Dokploy: POSTGRES_PASSWORD e JWT_SECRET.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://root_ranking:${POSTGRES_PASSWORD}@db:5432/root_ranking
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - 3000
    networks:
      - dokploy-network
      - internal

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: root_ranking
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: root_ranking
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root_ranking -d root_ranking"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

volumes:
  pgdata:

networks:
  # Rede do Traefik do Dokploy — precisa existir no servidor (o Dokploy já a cria).
  dokploy-network:
    external: true
  internal:
